name: SEO quality check
on:
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - 'scripts/check_seo.py'
      - '.github/workflows/seo-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check SEO metadata
        run: python scripts/check_seo.py
