<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{TITLE}} | PinkBulbTCG</title>
<meta name="description" content="{{DESCRIPTION}}">
<meta name="theme-color" content="#120a10">
<link rel="canonical" href="{{URL}}">
<meta property="og:type" content="article">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESCRIPTION}}">
<meta property="og:url" content="{{URL}}">
<link rel="icon" href="../bulb.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css">
<link rel="stylesheet" href="../artikelen.css">
</head>
<body>
<header><div class="bar"><a href="../index.html" class="logo"><img src="../bulb.png" alt="" width="44" height="44" decoding="async"><span>Pink<b>Bulb</b>TCG</span></a><button class="burger" id="menu-toggle" type="button" aria-label="Menu openen" aria-expanded="false" aria-controls="menu">☰</button><nav aria-label="Hoofdmenu"><ul id="menu"></ul></nav></div></header>
<main class="wrap article-page">
<article>
<p class="tag">{{CATEGORY}}</p>
<h1>{{TITLE}}</h1>
<p><time>{{DATE}}</time></p>
<div class="article-body">{{CONTENT}}</div>
<p><a class="btn" href="{{BACK_URL}}">← {{BACK_LABEL}}</a></p>
</article>
</main>
<footer><div class="wrap">© PinkBulbTCG · Mijn Pokémon-hobby, zonder filter.</div></footer>
<script src="../nav-menu.js?v=6" defer></script>
</body>
</html>
